[project]
name = "imagelib"
version = "0.1.0"
description = "Catalog, verify and de-duplicate photo libraries spread over many drives"
authors = [
    { name = "Steven Lilly", email = "splilly@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "blake3>=1.0.11",
    "exiv2>=0.19.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psd-tools>=1.25.0",
    "rawpy>=0.27.1",
]

[project.scripts]
imagelib = "imagelib:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
